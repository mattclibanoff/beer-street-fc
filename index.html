/* 4. fake betting odds on match previews (no money, obviously) */
function fracOdds(p){p=Math.min(.97,Math.max(.03,p));const d=(1-p)/p;const nice=[[1,100],[1,10],[1,5],[1,4],[1,3],[2,5],[1,2],[4,6],[4,5],[1,1],[6,5],[6,4],[7,4],[2,1],[5,2],[3,1],[4,1],[5,1],[6,1],[8,1],[10,1],[12,1],[16,1],[20,1],[25,1],[33,1],[50,1],[100,1]];
  let best=nice[0];nice.forEach(n=>{if(Math.abs(n[0]/n[1]-d)<Math.abs(best[0]/best[1]-d))best=n});return best[1]===1?`${best[0]}/1`:`${best[0]}/${best[1]}`}
function oddsRows(s,m,opp){
  const ppg=t=>{const f=formGames(s,t);if(!f.length)return 1.2;return f.reduce((a,x)=>a+(x.r==="W"?3:x.r==="D"?1:0),0)/f.length};
  const meets=allGames().filter(x=>oppOfGame(x.m)===opp&&view(x.m).played), h2h=meets.length?meets.filter(x=>view(x.m).r==="W").length/meets.length:.5;
  const us=ppg(US), them=ppg(opp), pw=Math.min(.9,Math.max(.08,.5+(us-them)*.16+(h2h-.5)*.2)), pl=Math.max(.06,(1-pw)*.85), pd=Math.max(.04,1-pw-pl);
  const ko=tmin(m.time)||1200, bar=ko+60, hh=Math.floor(bar/60)%12||12, mm=String(bar%60).padStart(2,"0");
  const ros=(DATA.roster||[]).filter(r=>r.pos!=="Retired"&&r.pos!=="Alternate");
  const seed=[...m.date].reduce((a,c)=>a+c.charCodeAt(0),0), pickR=k=>ros[(seed+k*7)%ros.length];
  const keeper=(DATA.roster||[]).find(r=>/^GK$/.test(r.pos||""));
  const rows=[[`Beer Street to win`,fracOdds(pw)],[`Draw`,fracOdds(pd)],[`${opp} to win`,fracOdds(pl)],
    [`${pickR(1).name} to score first`,fracOdds(.18)],[`${pickR(2).name} to be booked`,"12/1"],
    ["Ben M. to score five again","50/1"],[`${keeper?keeper.name:"Our keeper"} mistaken for a tree`,"4/1"],
    ["Pigeon pitch invasion","3/1"],[`At the bar by ${hh}:${mm}`,"1/100"],["Someone forgets their shin pads","2/5"]];
  return rows;
}
function oddsBoard(s,m,opp){const rows=oddsRows(s,m,opp);
  return `<div class="card odds"><h3>The Odds <small>· for entertainment only, no bets taken</small></h3><table class="odds-t"><tbody>${rows.map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td><b>${v}</b></td></tr>`).join("")}</tbody></table></div>`;
}

/* Madame Pint's weekly stars: one forecast per player with a star sign, new every Monday */
const SIGNS={Aries:"♈",Taurus:"♉",Gemini:"♊",Cancer:"♋",Leo:"♌",Virgo:"♍",Libra:"♎",Scorpio:"♏",Sagittarius:"♐",Capricorn:"♑",Aquarius:"♒",Pisces:"♓"};
const SIGN_TRAIT={Aries:"Your natural urge to charge at everything",Taurus:"Your famous stubbornness",Gemini:"Both of your personalities",Cancer:"Your protective instincts",Leo:"Your love of the spotlight",
  Virgo:"Your obsession with tidy passing",Libra:"Your eternal search for balance",Scorpio:"Your quiet intensity",Sagittarius:"Your restless, wandering spirit",Capricorn:"Your relentless work rate",Aquarius:"Your unpredictable genius",Pisces:"Your dreamy vision"};
function horoscopes(wk,out){
  const ppl=(DATA.roster||[]).filter(r=>r.sign&&SIGNS[r.sign]&&!out.has(r.name));
  if(!ppl.length)return "";
  const h=str=>{let x=wk*2654435761>>>0;for(const c of str)x=Math.imul(x^c.charCodeAt(0),16777619)>>>0;return x};
  const PLANET=["Mars","Venus","Jupiter","Saturn","Mercury","the Moon","Neptune","Uranus"],
        HOUSE=["penalty area","centre circle","sixth house of set pieces","dugout","six-yard box","house of hydration","far post","pub garden","touchline","house of the offside trap","corner flag","kit bag","group chat"];
  const POS=pos=>/GK/.test(pos||"")?{act:"saves",zone:"your own goal"}:/DF/.test(pos||"")?{act:"tackles",zone:"the back line"}:/MF/.test(pos||"")?{act:"passes",zone:"midfield"}:{act:"shots",zone:"the box"};
  const LINES={5:["Expect a career night: your {act} will be talked about at the bar until Christmas.","The stars have rarely been this clear. Something special is coming in {zone}.","A rare cosmic green light. Back yourself and go for it."],
    4:["A strong week. Your {act} land where you mean them to, mostly.","Confidence is high. A goal contribution is written in the stars, or at least pencilled in.","Good energy around {zone}. Your teammates will notice."],
    3:["A solid, honest shift is forecast. Nobody will write songs about it, but nobody will complain either.","Steady as she goes. Keep it simple and the universe will meet you halfway.","Middle of the road, which is fine, because that is where the ball usually is."],
    2:["Your {act} may wobble early. Stick with it; the second half belongs to you.","The cosmos advises a calm warm-up and an extra stretch. Then go again.","A slow start is likely. Patience, and maybe a little less ambition from range."],
    1:["The stars suggest keeping it very simple this week. Short passes. Deep breaths.","Retrograde chaos in {zone}. Laugh it off and buy the first round; it resets the karma.","Not your week to be a hero. Be a great teammate instead and the stars will remember."]};
  const LUCKY=["a lucky left sock","the colour orange","a pre-game banana","shin pads on the correct legs","an untied bootlace (please tie it)","a high-five from the captain","the number 7","a cold pint at full time","stretching for once","arriving five minutes early","a fresh pair of grip socks","the word 'Beer' on your shirt","a pre-match playlist"];
  const fill=(t,p)=>t.replace("{act}",p.act).replace("{zone}",p.zone);
  const cap=t=>t[0].toUpperCase()+t.slice(1), o=h("week");   // planets, houses and charms are dealt out so nobody shares one in the same issue
  const items=ppl.map((r,i)=>{const x=h(r.name),deal=(a,k)=>a[((o>>>k)+i)%a.length],q=(x>>>20)%20,stars=q<2?1:q<6?2:q<12?3:q<17?4:5,p=POS(r.pos),pick=(a,k)=>a[(x>>>k)%a.length];
    return `<div class="np-star"><div class="np-star-h"><span class="np-glyph" title="${r.sign}">${SIGNS[r.sign]}\uFE0E</span><b>${esc(r.name)}</b><span class="np-rate" title="Forecast: ${stars} of 5">${"★".repeat(stars)}${"☆".repeat(5-stars)}</span></div>
      <p>${cap(deal(PLANET,4))} drifts through your ${deal(HOUSE,9)}. ${SIGN_TRAIT[r.sign]} ${stars>=3?"works in your favour":"needs a gentle leash"} this week. ${fill(pick(LINES[stars],11),p)} <i>Lucky charm: ${deal(LUCKY,14)}.</i></p></div>`});
  return `<div class="np-ads np-stars"><h3>Madame Pint's Stars <small>· your week on the pitch, foretold</small></h3><div class="np-star-grid">${items.join("")}</div></div>`;
}
function renderBackPage(){
  const T=DATA.tabloid||{}, out=new Set(T.optOut||[]), ok=x=>!x.who||!out.has(x.who);
  const wk=Math.floor((Date.UTC(...TODAY.split("-").map((x,i)=>i===1?x-1:+x))/864e5+3)/7);   // changes every Monday
  // this week's fresh items ("added" within the last 8 days) go first, then the pool rotates every Monday
  const fresh=x=>x.added&&(Date.UTC(...TODAY.split("-").map((v,i)=>i===1?v-1:+v))-Date.UTC(...x.added.split("-").map((v,i)=>i===1?v-1:+v)))/864e5<=8;
  // one appearance per player per issue, so the page rotates through the squad; alternates only fill gaps
  const ALT=new Set(T.alternates||[]),seen=new Set();
  const pick=(arr,n)=>{const a=(arr||[]).filter(ok);if(!a.length)return [];
    const st=(wk*n)%a.length,rot=a.slice(st).concat(a.slice(0,st));
    const order=rot.filter(fresh).concat(rot.filter(x=>!fresh(x)&&!ALT.has(x.who)),rot.filter(x=>!fresh(x)&&ALT.has(x.who)));
    const out=[];for(const x of order){if(out.length>=n)break;if(x.who&&seen.has(x.who))continue;out.push(x);if(x.who)seen.add(x.who)}
    for(const x of order){if(out.length>=n)break;if(!out.includes(x))out.push(x)}return out};
  const rumours=pick(T.rumours,3), overheard=pick(T.overheard,4);
  // fines committee: Bad Boy / Bad Girl and cards, from this season's stats
  const ps=seasonPlayers(current).filter(p=>!out.has(p.name));
  const fouls=ps.filter(p=>p.fouls).sort((a,b)=>b.fouls-a.fouls)[0], carded=ps.filter(p=>p.yellow||p.red);
  const fines=[];
  if(fouls) fines.push(`${(DATA.womanOfMatch||[]).includes(fouls.name)?"Bad Girl":"Bad Boy"} of the season so far: <b>${esc(fouls.name)}</b>, ${fouls.fouls} foul${fouls.fouls>1?"s":""}. The committee has fined them one round.`);
  carded.forEach(p=>fines.push(`<b>${esc(p.name)}</b>: ${[p.yellow?p.yellow+" yellow":"",p.red?p.red+" red":""].filter(Boolean).join(", ")}. Pay up at the bar.`));
  if(!fines.length) fines.push("No fines yet. The committee is watching. The committee is always watching.");
  const head=T.headline||(rumours.length?"Pigeon Watch: transfer window swings open":"All quiet on Beer Street");
  document.getElementById("npBack").innerHTML=`<div class="np-backmast">The Beer Street Gazette · <i>Back Page</i></div>
    <h2 class="np-head np-backhead">${esc(head)}</h2>
    <div class="np-cols">
      <section><h3>Transfer Talk</h3>${rumours.map(x=>`<p>${esc(x.text)}</p>`).join("")||"<p>Nothing to report.</p>"}</section>
      <section><h3>Overheard at the Bar</h3>${overheard.map(x=>`<p>${esc(x.text)}</p>`).join("")}</section>
      <section><h3>The Fines Committee</h3>${fines.map(x=>`<p>${x}</p>`).join("")}<h3 id="npAbsHead" hidden>Suspicious Absences</h3><div id="npAbs"></div></section>
    </div>
    ${(()=>{const ads=pick(T.ads,4);return ads.length?`<div class="np-ads"><h3>Classifieds</h3><div class="np-ad-grid">${ads.map(a=>`<div class="np-ad"><b>${esc(a.title)}</b>${esc(a.text)}</div>`).join("")}</div></div>`:""})()}
    ${horoscopes(wk,out)}
    <p class="np-small">All rumours unconfirmed. Most unconfirmable. Players wishing to be left out of the back page should speak to the captain.</p>`;
  // suspicious absences: anyone marked Out for the next game
  const g=typeof attGame==="function"?attGame():null;
  if(g) attLoad(g.date).then(a=>{if(!a)return;const outs=Object.entries(a).filter(([n,x])=>x.s==="out"&&!out.has(n)).map(([n])=>n);
    if(!outs.length)return;document.getElementById("npAbsHead").hidden=false;
    document.getElementById("npAbs").innerHTML=`<p>${outs.map(esc).join(", ")} ${outs.length>1?"have":"has"} declared themselves unavailable for ${fmtDate(g.date,{weekday:"long"})}. The Gazette asks only: why?</p>`});
}
function openLanding(el){
  tearPaper();
  const close=()=>{el.hidden=true;document.body.classList.remove("landing-open");document.dispatchEvent(new Event("landingclosed"));const tb=document.querySelector('.tab[aria-selected="true"]');if(tb)tb.focus({preventScroll:true});};

    if(toBack&&!back.innerHTML)renderBackPage();back.hidden=!toBack;front.hidden=toBack;b.textContent=toBack?"Front page ↻":"Back page ↻";el.scrollTop=0;});
